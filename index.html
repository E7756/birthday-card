<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:ital@0;1&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f3ed;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid #eae5dd;
            text-align: center;
            position: relative;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #4a4a4a;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #9a9a9a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .main-title {
            font-family: 'Amiri', serif;
            font-size: 2.1rem;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: #cbcfc4;
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .description {
            font-size: 1rem;
            color: #777777;
            margin-bottom: 35px;
        }

        .btn {
            background-color: #6d7865;
            color: #ffffff;
            border: none;
            padding: 14px 45px;
            font-size: 1.05rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(109, 120, 101, 0.2);
        }

        .btn:hover {
            background-color: #5a6453;
            transform: translateY(-2px);
        }

        .secret-message {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #e0e0e0;
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.7;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">Letters ♡</div>
        <div class="subtitle">A LITTLE BIRTHDAY SURPRISE</div>

        <h1 class="main-title">عندي لكِ شيء<br>صغير يا عهود...</h1>

        <div class="divider"></div>

        <p class="description">شيء بسيط، بس معمول مخصوص لك.</p>

        <button class="btn" onclick="openSurprise()">افتحيها</button>

        <div id="message" class="secret-message">
            <p>🎉 كل عام وأنتِ بخير وصحة وسعادة يا سارة! 🤍</p>
            <p style="margin-top: 10px; font-size: 0.95rem; color: #888;">أتمنى لكِ سنة جديدة مليئة بالأيام الجميلة والنجاحات.</p>
        </div>

        <audio id="bg-music" src="song.mp3"></audio>
    </div>

    <script>
        function openSurprise() {
            var music = document.getElementById("bg-music");
            var message = document.getElementById("message");
            var btn = document.querySelector(".btn");

            music.play();
            message.style.display = "block";
            btn.style.display = "none";
        }
    </script>

</body>
</html>
